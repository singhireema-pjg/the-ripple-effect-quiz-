<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ripple Effect - Critical Thinking Quiz</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f6f8;color:#17202a}
  .quiz{max-width:850px;margin:0 auto;padding:28px}
  .header{background:#17202a;color:white;padding:24px;border-radius:18px;margin-bottom:20px}
  .header h1{margin:0 0 8px;font-size:28px}
  .header p{margin:0;opacity:.9}
  .progress{margin-top:16px;background:#ffffff33;border-radius:20px;height:9px;overflow:hidden}
  .bar{height:100%;width:0;background:#fff;transition:.25s}
  .card{background:white;border-radius:18px;padding:24px;box-shadow:0 3px 12px #00000012}
  .qnum{font-size:14px;font-weight:bold;color:#65717d;margin-bottom:10px}
  .question{font-size:20px;line-height:1.45;font-weight:700;margin-bottom:20px}
  .option{display:block;border:2px solid #dce2e7;border-radius:12px;padding:14px 16px;margin:10px 0;cursor:pointer;transition:.15s}
  .option:hover{border-color:#8b99a8;background:#f8fafb}
  .option input{margin-right:10px}
  .option.selected{border-color:#3d596f;background:#eef3f7}
  .actions{display:flex;justify-content:space-between;gap:12px;margin-top:22px}
  button{border:0;border-radius:10px;padding:12px 20px;font-size:16px;font-weight:bold;cursor:pointer}
  .next{background:#17202a;color:white}
  .back{background:#e8edf1;color:#17202a}
  button:disabled{opacity:.45;cursor:not-allowed}
  .feedback{margin-top:18px;padding:16px;border-radius:12px;background:#eef7ef;display:none}
  .feedback.show{display:block}
  .result{text-align:center}
  .score{font-size:46px;font-weight:800;margin:15px 0}
  .result p{font-size:18px;line-height:1.5}
  .restart{background:#17202a;color:#fff;margin-top:15px}
  .name{margin-top:16px}
  .name input{width:100%;padding:12px;border:2px solid #dce2e7;border-radius:10px;font-size:16px}
  .note{font-size:13px;color:#66727e;margin-top:8px}
</style>
</head>
<body>
<div class="quiz">
  <div class="header">
    <h1>The Ripple Effect</h1>
    <p>Critical Thinking & Logical Reasoning • Ages 12–14</p>
    <div class="progress"><div class="bar" id="bar"></div></div>
  </div>
  <div id="app"></div>
</div>

<script>
const questions = [
{
 q:"Your class is preparing for a school exhibition. The team leader decides to spend most of the budget on decorations, leaving very little money for the working model. What is the most likely ripple effect?",
 type:"single",
 options:[
 "The exhibition will automatically receive more visitors.",
 "The team may struggle to complete or improve the working model.",
 "Every student will become more interested in the project.",
 "The project will require fewer materials."
 ],
 answer:[1],
 explain:"Spending too much of a limited budget on decorations can leave fewer resources for the main working model."
},
{
 q:"A group decides to finish its exhibition model at the last minute because they believe they will have plenty of time. Which possible consequences should they consider? Select all that apply.",
 type:"multi",
 options:[
 "There may be no time to fix unexpected problems.",
 "The team may have to rush important tasks.",
 "The quality of the final model could be affected.",
 "The model will definitely be the best in the exhibition."
 ],
 answer:[0,1,2],
 explain:"Less time means fewer opportunities to fix problems, rushed work, and potentially lower quality."
},
{
 q:"A student says, “Our model worked perfectly once, so we don't need to test it again before the exhibition.” What is the main weakness in this reasoning?",
 type:"single",
 options:[
 "One successful test does not guarantee that the model will always work.",
 "The model should be tested only after the exhibition.",
 "Testing makes every project more expensive.",
 "A successful test means the model is unnecessary."
 ],
 answer:[0],
 explain:"One successful result is limited evidence. Further testing can reveal problems that do not appear every time."
},
{
 q:"A small decision made early in a project can create larger consequences later if its effects continue to build.",
 type:"tf",
 options:["True","False"],
 answer:[0],
 explain:"The ripple effect means that one early choice can influence several later events."
},
{
 q:"A team has two days left before its exhibition. One student suggests adding three new features to make the project more impressive. Another suggests testing and improving the existing model. The existing model still has occasional problems. Which is the more logical choice?",
 type:"single",
 options:[
 "Add all three features immediately.",
 "Ignore the existing problems and focus on appearance.",
 "Test and improve the existing model first.",
 "Stop working because the project already has enough features."
 ],
 answer:[2],
 explain:"Fixing known problems first reduces an immediate risk before introducing additional complexity."
},
{
 q:"A team chooses one student to do all the important work because that student is the most experienced. Which ripple effects could result? Select all that apply.",
 type:"multi",
 options:[
 "The student may become overloaded.",
 "Other team members may have fewer opportunities to contribute.",
 "The project may be affected if that student becomes unavailable.",
 "The team is guaranteed to finish earlier."
 ],
 answer:[0,1,2],
 explain:"Concentrating responsibility in one person can create overload, reduce participation, and make the project vulnerable if that person becomes unavailable."
},
{
 q:"A group notices that its project is behind schedule. Instead of asking why, they immediately decide that everyone must work faster. Which question would best help them think logically before making that decision?",
 type:"single",
 options:[
 "Who is working the fastest right now?",
 "What is causing the delay?",
 "Which group has the most decorations?",
 "Can we finish without changing anything?"
 ],
 answer:[1],
 explain:"Identifying the cause helps the team choose a solution that addresses the actual problem."
},
{
 q:"If a decision produces a good result, that automatically proves that the reasoning behind the decision was good.",
 type:"tf",
 options:["True","False"],
 answer:[1],
 explain:"A good result does not automatically prove that the reasoning was sound. The quality of the reasoning must be examined separately."
}
];

let current=0, answers=Array(questions.length).fill(null);

function render(){
 const app=document.getElementById("app");
 const q=questions[current];
 const pct=Math.round((current/questions.length)*100);
 document.getElementById("bar").style.width=pct+"%";

 let html=`<div class="card"><div class="qnum">QUESTION ${current+1} OF ${questions.length}</div>
 <div class="question">${q.q}</div>`;

 if(q.type==="tf"){
   q.options.forEach((o,i)=>{
     const checked=answers[current]?.includes(i)?"checked":"";
     html+=`<label class="option ${checked?'selected':''}"><input type="radio" name="ans" value="${i}" ${checked}>${o}</label>`;
   });
 }else{
   q.options.forEach((o,i)=>{
     const checked=answers[current]?.includes(i)?"checked":"";
     const multi=q.type==="multi";
     html+=`<label class="option ${checked?'selected':''}"><input type="${multi?'checkbox':'radio'}" name="ans" value="${i}" ${checked}>${o}</label>`;
   });
 }

 html+=`<div class="feedback" id="feedback"></div>
 <div class="actions"><button class="back" id="back" ${current===0?'disabled':''}>Back</button>
 <button class="next" id="next">${current===questions.length-1?'Finish':'Next'}</button></div></div>`;
 app.innerHTML=html;

 document.querySelectorAll(".option").forEach(el=>{
   el.addEventListener("click",()=>el.classList.toggle("selected",el.querySelector("input").checked));
 });
 document.getElementById("back").onclick=()=>{save();current--;render()};
 document.getElementById("next").onclick=()=>{
   if(!save()){document.getElementById("feedback").textContent="Please select an answer before continuing.";document.getElementById("feedback").classList.add("show");return;}
   if(current<questions.length-1){current++;render()}else{showResult()}
 };
}

function save(){
 const selected=[...document.querySelectorAll('input[name="ans"]:checked')].map(x=>Number(x.value));
 if(!selected.length)return false;
 answers[current]=selected;
 return true;
}

function showResult(){
 let score=0;
 questions.forEach((q,i)=>{
   const a=answers[i]||[];
   if(a.length===q.answer.length && a.every(x=>q.answer.includes(x)))score++;
 });
 const pct=Math.round(score/questions.length*100);
 let msg=pct>=80?"Excellent logical thinking! You considered consequences and evidence carefully."
          :pct>=60?"Good thinking! Keep practising how one choice can create several consequences."
          :"Keep practising. When making a decision, ask: What happens next? And what could happen after that?";
 document.getElementById("bar").style.width="100%";
 document.getElementById("app").innerHTML=`<div class="card result">
 <div class="qnum">ASSESSMENT COMPLETE</div>
 <h2>Your Ripple Effect Score</h2>
 <div class="score">${score} / ${questions.length}</div>
 <p><strong>${pct}%</strong></p><p>${msg}</p>
 <p><strong>Remember:</strong> Decision → Immediate Effect → Ripple Effect → Outcome</p>
 <button class="restart" onclick="restart()">Try Again</button>
 </div>`;
}
function restart(){current=0;answers=Array(questions.length).fill(null);render();}
render();
</script>
</body>
</html>
